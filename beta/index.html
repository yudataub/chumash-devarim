<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קטלוג חומרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1e2433; --muted:#6b7385; --line:#e6e8f0;
  --accent:#4f46e5; --accent-soft:#eef0ff; --gold:#f59e0b; --chip:#f1f3f9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
header{background:linear-gradient(135deg,#312e81,#4f46e5 60%,#7c3aed);color:#fff;padding:22px 16px 18px}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0;font-size:1.6rem;font-weight:800}
.sub{opacity:.85;font-size:.95rem;margin-top:4px}
.back{color:#fff;opacity:.8;font-size:.85rem;text-decoration:none}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input{flex:1 1 260px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.search select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap}
.tab .n{color:var(--muted);font-size:.8rem;margin-inline-start:4px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on .n{color:#cbd0dc}
main{padding:8px 16px 60px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .cnt{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:500}
.row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:hover{background:#fafbff}
.ic{font-size:1.25rem;width:28px;text-align:center;flex:0 0 auto}
.ti{flex:1 1 240px;min-width:0}
.ti .name{font-weight:500;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:.72rem;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:#4338ca;white-space:nowrap}
.badge.tabname{background:#ecfdf5;color:#047857}
.badge.grade{background:#fdf2f8;color:#be185d}
.badge.new{background:#fff7ed;color:#c2410c}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font-size:.8rem;font-weight:700;text-decoration:none;border:1px solid;border-radius:999px;padding:3px 12px;white-space:nowrap}
.btn .sz{font-weight:400;opacity:.75;margin-inline-start:6px;font-size:.72rem}
.btn:hover{filter:brightness(.95);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stars{display:inline-flex;direction:ltr}
.stars button{border:0;background:none;padding:0 1px;font-size:1rem;color:#d4d7e0;cursor:pointer}
.stars button.on{color:var(--gold)}
.avg{font-size:.75rem;color:var(--muted);min-width:42px}
.fav{border:0;background:none;font-size:1.15rem;cursor:pointer;color:#c8ccd8}
.fav{font-size:1.3rem;line-height:1}.fav.on{color:#e11d48}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.more{display:block;margin:6px auto 12px;font:inherit;font-size:.9rem;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer}
.howto{font-size:.85rem;color:var(--muted);margin:10px 0 0}
@media (max-width:640px){h1{font-size:1.3rem}header{padding:14px 16px 12px}.sub{font-size:.85rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chip{flex:0 0 auto}
  .search select{flex:1 1 40%}.tools{padding:8px 12px}.row{padding:9px 12px}.side{width:100%;justify-content:flex-start;padding-inline-start:38px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="https://www.kol-toda.co.il/t/books.html">→ לכל הקטלוגים באתר הקול החמישי</a>
  <h1 id="title">קטלוג חומרים</h1>
  <div class="sub" id="sub"></div>
</div></header>

<div class="tools"><div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="חיפוש בכל הפרשות – למשל: מרגלים, תפזורת, מבחן…" autocomplete="off">
    <select id="src" aria-label="מקור"><option value="">כל המקורות</option></select>
    <select id="grade" aria-label="כיתה"><option value="">כל הכיתות</option></select>
    <select id="sort" aria-label="סדר"><option value="rate">המדורגים קודם</option><option value="abc">לפי א״ב</option></select>
  </div>
  <div class="chips" id="fmt"></div>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <main id="main"><div class="empty">טוען…</div></main>
</div>

<script>
// icon, button text, colour, background – the same colours as the Neviim catalogs
const FMT = {pdf:["📕","PDF","#e11d48","#fde8ec"],word:["📘","Word","#2563eb","#e8eefd"],ppt:["📊","מצגת","#ea580c","#fdece0"],
  video:["🎬","סרטון","#dc2626","#fde8e8"],game:["🎮","משחק מקוון","#7c3aed","#f1eafe"],web:["🔗","קישור","#4f46e5","#eceafd"],
  folder:["📁","תיקייה","#ca8a04","#fdf6e0"],excel:["📗","Excel","#16a34a","#e7f7ec"],image:["🖼️","תמונה","#0d9488","#e0f5f1"],
  audio:["🎵","שמע","#0891b2","#e0f5fa"]};
const FILTERS = [["","הכל"],["pdf","להדפסה"],["word","לעריכה"],["ppt","מצגות"],["video","סרטונים"],["game","משחקים מקוונים"],["fav","♥ השמורים שלי"]];
let D, state = {tab:null, q:"", fmt:"", src:"", grade:"", sort:"rate"}, PAGE = 40;
const LS = k => "cat2_" + (D ? D.book : "") + "_" + k;
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(LS(k))) ?? d; } catch(e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch(e) {} };
let FAV = new Set(), MINE = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).replace(/[֑-ׇ]/g, "").toLowerCase();
const keyOf = it => it.files[0].id;
const idsOf = it => it.files.map(f => f.id).concat(it.dup || []);

function rating(it) {
  const R = window.__ratingsApi && window.__ratingsApi.ratingsCache;
  let sum = 0, count = 0;
  if (R) idsOf(it).forEach(id => { const r = R.get(id); if (r) { sum += r.sum || 0; count += r.count || 0; } });
  return {avg: count ? sum / count : 0, count};
}

function visibleItems() {
  const q = norm(state.q.trim());
  return D.items.filter(it => {
    if (state.fmt === "fav") { if (!FAV.has(keyOf(it))) return false; }
    else if (state.fmt && !it.files.some(f => f.f.replace("achiya:", "") === state.fmt)) return false;
    if (state.src && it.s !== state.src) return false;
    if (state.grade && it.gr && it.gr !== state.grade) return false;   // unknown grade stays visible
    if (q) return norm(it.t).includes(q);
    if (state.fmt === "fav") return true;
    return it.tab === state.tab;
  });
}

function renderTabs() {
  const cnt = {}; D.items.forEach(i => cnt[i.tab] = (cnt[i.tab] || 0) + 1);
  document.getElementById("tabs").innerHTML = D.tabs.map(t =>
    `<button class="tab${t.k === state.tab && !state.q && state.fmt !== "fav" ? " on" : ""}" data-k="${esc(t.k)}">${t.e} ${esc(t.l)}<span class="n">${cnt[t.k] || 0}</span></button>`).join("");
}

function rowHtml(it, showTab) {
  const r = rating(it), k = keyOf(it), mine = MINE[k] || 0, shown = mine || Math.round(r.avg);
  const tabL = showTab ? (D.tabs.find(t => t.k === it.tab) || {}).l : "";
  const icon = (FMT[it.files[0].f.replace("achiya:", "")] || FMT.web)[0];
  const btns = it.files.map(btnHtml).join("");
  const stars = [1,2,3,4,5].map(v => `<button class="${v <= shown ? "on" : ""}" data-rate="${v}" aria-label="דירוג ${v}">★</button>`).join("");
  return `<div class="row" data-id="${esc(k)}">
    <div class="ic">${icon}</div>
    <div class="ti"><div class="name">${esc(it.t)}</div>
      <div class="meta">${it.gr ? `<span class="badge grade">${esc(it.gr)}</span>` : ""}${tabL ? `<span class="badge tabname">${esc(tabL)}</span>` : ""}${it.s ? `<span class="badge">${esc(it.s)}</span>` : ""}${it.n ? `<span class="badge new">חדש</span>` : ""}</div></div>
    <div class="btns">${btns}</div>
    <div class="side"><span class="stars" title="דירוג משותף – לוחצים על כוכב כדי לדרג">${stars}</span><span class="avg">${r.count ? r.avg.toFixed(1) + " (" + r.count + ")" : ""}</span>
      <button class="fav${FAV.has(k) ? " on" : ""}" data-fav="1" title="שמירה ברשימה האישית שלי">${FAV.has(k) ? "♥" : "♡"}</button></div>
  </div>`;
}

function btnHtml(file) {
  const ach = file.f.startsWith("achiya:"), k = file.f.replace("achiya:", ""), m = FMT[k] || FMT.web;
  const text = ach ? (k !== "web" ? m[1] + " · באתר אחיה" : "באתר אחיה") : m[1];
  return `<a class="btn" style="color:${m[2]};background:${m[3]};border-color:${m[3]}" href="${esc(file.u)}" target="_blank" rel="noopener">${text}${file.z ? ` <span class="sz">· ${esc(file.z)}</span>` : ""}</a>`;
}
function sortItems(arr) {
  const abc = (a, b) => a.t.localeCompare(b.t, "he", {numeric: true});
  if (state.sort === "abc") return arr.sort(abc);
  const score = i => { const r = rating(i); return r.avg * Math.min(r.count, 3); };
  return arr.sort((a, b) => (score(b) - score(a)) || abc(a, b));
}

function render() {
  renderTabs();
  const items = visibleItems(), main = document.getElementById("main");
  const cross = !!state.q.trim() || state.fmt === "fav";
  if (!items.length) { main.innerHTML = `<div class="empty">${state.fmt === "fav" ? "עוד לא שמרתם חומרים – לוחצים על ♡ ליד חומר כדי לשמור אותו כאן" : "לא נמצאו חומרים. נסו מילה אחרת או לשונית אחרת."}</div>`; return; }
  const byCat = {}; items.forEach(i => (byCat[i.c] = byCat[i.c] || []).push(i));
  main.innerHTML = D.cats.filter(c => byCat[c.k]).map(c => {
    const list = sortItems(byCat[c.k]);
    const first = list.slice(0, PAGE).map(i => rowHtml(i, cross)).join("");
    const rest = list.length > PAGE ? `<button class="more" data-cat="${c.k}">הצגת כל ${list.length}</button>` : "";
    return `<details class="cat" open data-cat="${c.k}"><summary><span>${c.e} ${esc(c.l)}</span><span class="cnt">${list.length}</span></summary>${first}${rest}</details>`;
  }).join("");
  loadRatings(items);
}

async function loadRatings(items) {
  const api = window.__ratingsApi; if (!api) return;
  const ids = items.slice(0, 400).flatMap(idsOf);
  const before = api.ratingsCache.size;
  await api.fetchRatings(ids);
  if (api.ratingsCache.size !== before) document.querySelectorAll(".row").forEach(row => {
    const it = BYKEY[row.dataset.id]; if (!it) return;
    const r = rating(it); row.querySelector(".avg").textContent = r.count ? r.avg.toFixed(1) + " (" + r.count + ")" : "";
    const shown = MINE[row.dataset.id] || Math.round(r.avg);
    row.querySelectorAll(".stars button").forEach(b => b.classList.toggle("on", +b.dataset.rate <= shown));
  });
}

let BYKEY = {};
function setTab(k) { state.tab = k; state.q = ""; document.getElementById("q").value = ""; if (state.fmt === "fav") state.fmt = ""; history.replaceState(null, "", "#" + encodeURIComponent(k)); renderChips(); render(); window.scrollTo({top: 0}); }
function renderChips() {
  document.getElementById("fmt").innerHTML = FILTERS.map(([k, l]) => `<button class="chip${state.fmt === k ? " on" : ""}" data-fmt="${k}">${l}</button>`).join("");
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-k],[data-fmt],[data-cat].more,[data-rate],[data-fav]"); if (!t) return;
  if (t.dataset.k !== undefined) return setTab(t.dataset.k);
  if (t.dataset.fmt !== undefined) { state.fmt = state.fmt === t.dataset.fmt ? "" : t.dataset.fmt; renderChips(); return render(); }
  if (t.classList.contains("more")) {
    const c = t.dataset.cat, sec = t.closest("details");
    const list = sortItems(visibleItems().filter(i => i.c === c));
    t.remove(); sec.insertAdjacentHTML("beforeend", list.slice(PAGE).map(i => rowHtml(i, !!state.q.trim() || state.fmt === "fav")).join(""));
    return loadRatings(list);
  }
  const row = t.closest(".row"); if (!row) return; const k = row.dataset.id;
  if (t.dataset.fav) { FAV.has(k) ? FAV.delete(k) : FAV.add(k); save("fav", [...FAV]); t.classList.toggle("on"); t.textContent = FAV.has(k) ? "♥" : "♡"; return; }
  if (t.dataset.rate) {
    const v = +t.dataset.rate, old = MINE[k] || 0; if (v === old) return;
    MINE[k] = v; save("mine", MINE);
    row.querySelectorAll(".stars button").forEach(b => b.classList.toggle("on", +b.dataset.rate <= v));
    try { await window.__ratingsApi.submitRating(k, v, old); window.__ratingsApi.ratingsCache.delete(k); loadRatings([BYKEY[k]]); } catch (err) { console.error(err); }
  }
});
let qTimer; document.getElementById("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 200); });
document.getElementById("src").addEventListener("change", e => { state.src = e.target.value; render(); });
document.getElementById("grade").addEventListener("change", e => { state.grade = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
window.addEventListener("ratings-ready", () => D && render());

fetch("data.json").then(r => r.json()).then(data => {
  D = data; FAV = new Set(load("fav", [])); MINE = load("mine", {});
  D.items.forEach(i => BYKEY[keyOf(i)] = i);
  document.title = "קטלוג חומרים – חומש " + D.book;
  document.getElementById("title").textContent = "קטלוג חומרים – חומש " + D.book;
  const files = D.items.reduce((n, i) => n + i.files.length, 0);
  document.getElementById("sub").textContent = `${D.items.length.toLocaleString("he")} חומרים לפי פרשות • בוחרים פרשה, ואז מה צריך לשיעור`;
  const srcs = [...new Set(D.items.map(i => i.s).filter(Boolean))].sort((a, b) => a.localeCompare(b, "he"));
  document.getElementById("src").insertAdjacentHTML("beforeend", srcs.map(s => `<option>${esc(s)}</option>`).join(""));
  const grades = ["הגיל הרך", "כיתות א, ב", "כיתות ג, ד, ה", "כיתות ו, ז, ח", "מורים", "הורים"].filter(g => D.items.some(i => i.gr === g));
  document.getElementById("grade").insertAdjacentHTML("beforeend", grades.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join(""));
  if (!grades.length) document.getElementById("grade").style.display = "none";
  const h = decodeURIComponent(location.hash.slice(1));
  state.tab = D.tabs.some(t => t.k === h) ? h : (D.tabs[1] || D.tabs[0]).k;
  renderChips(); render();
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDocs, collection, query, where, documentId, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig = {"apiKey": ["AIza", "SyBgjtJk9Wrw-lPpFlPBaQ6RHfqQ58R58LA"].join(""), "authDomain": "gamma-catalog.firebaseapp.com", "projectId": "gamma-catalog", "storageBucket": "gamma-catalog.firebasestorage.app", "messagingSenderId": "184606827021", "appId": "1:184606827021:web:e39a832b5bc12fe87aeb44"};
const db = getFirestore(initializeApp(firebaseConfig));
const ratingsCache = new Map();
async function fetchRatings(ids) {
  const need = [...new Set(ids)].filter(id => !ratingsCache.has(id));
  for (let i = 0; i < need.length; i += 10) {
    const b = need.slice(i, i + 10); b.forEach(id => ratingsCache.set(id, {sum: 0, count: 0}));
    try { (await getDocs(query(collection(db, "ratings"), where(documentId(), "in", b)))).forEach(d => ratingsCache.set(d.id, d.data())); }
    catch (e) { console.error("fetchRatings failed", e); }
  }
}
async function submitRating(id, newValue, oldValue) {
  const ref = doc(db, "ratings", id);
  await runTransaction(db, async tx => {
    const snap = await tx.get(ref); let sum = 0, count = 0;
    if (snap.exists()) { sum = snap.data().sum || 0; count = snap.data().count || 0; }
    if (oldValue) sum += newValue - oldValue; else { sum += newValue; count += 1; }
    tx.set(ref, {sum, count});
  });
}
window.__ratingsApi = {fetchRatings, submitRating, ratingsCache};
window.dispatchEvent(new Event("ratings-ready"));
</script>
</body>
</html>
